# Classical EI Mass Spectrum Predictor Configuration
# Calibrated parameters based on physical organic chemistry & quasi-equilibrium theory (QET)

general:
  nominal_mass_mode: true
  min_peak_rel_intensity: 0.5    # Minimum relative intensity (base peak = 100) to report
  max_mz: 500                    # Maximum m/z considered
  default_energy_ev: 70.0        # Standard beam energy

# Stevenson's Rule Carbocation Stability Scores
carbocation_stability:
  oxonium: 5.2                   # R-O+=C, resonance stabilized
  iminium: 5.5                   # R-N+=C, very high stability
  acylium: 4.8                   # R-C#O+, highly stabilized
  aroyl: 5.5                     # Ar-C#O+, highly stabilized
  tropylium: 4.6                 # C7H7+ aromatic 6 pi cation
  benzylic: 4.0                  # Ar-CH2+
  allylic: 3.5                   # C=C-CH2+
  tertiary: 3.0                  # R3C+
  secondary: 2.0                 # R2CH+
  primary: 1.0                   # RCH2+
  methyl: 0.2                    # CH3+

# Radical Leaving Group Stability Scores
radical_stability:
  tertiary: 2.5                  # R3C.
  secondary: 2.0                 # R2CH.
  primary: 1.2                   # RCH2.
  methyl: 0.6                    # CH3.
  aryl: 0.3                      # Ar. sigma-radical
  hydrogen: 0.1                  # H.
  halogen_i: 3.0                 # I.
  halogen_br: 2.2                # Br.
  halogen_cl: 1.5                # Cl.

# Quasi-Equilibrium Theory (QET) Activation Kinetics
# P(E) = 1 / (1 + exp(-(E_beam - E0) / sigma))
kinetics:
  molecular_ion:
    # Aromatic rings have low ionization energy and high stability
    aromatic_base_stability: 3.8
    conjugated_base_stability: 2.5
    aliphatic_base_stability: 0.4
    decay_rate_ev: 0.035          # Internal energy dissipation factor

  mechanisms:
    mclafferty:
      e0: 11.0                   # Low barrier 6-membered cyclic rearrangement (eV)
      sigma: 4.0
      base_prefactor: 3.6
    alpha_cleavage:
      e0: 13.0                   # Heteroatom-directed direct single bond cleavage (eV)
      sigma: 5.0
      base_prefactor: 1.5
    inductive_cleavage:
      e0: 13.5                   # Heterolytic C-X cleavage (eV)
      sigma: 5.0
      base_prefactor: 2.0
    benzylic_tropylium:
      e0: 11.5                   # Benzylic cleavage + ring expansion (eV)
      sigma: 4.0
      base_prefactor: 3.2
    retro_diels_alder:
      e0: 12.5                   # 6-membered ring concerted/stepwise cleavage (eV)
      sigma: 4.5
      base_prefactor: 1.4
    dehydration_elimination:
      e0: 13.5                   # Loss of H2O from aliphatic alcohol (eV)
      sigma: 5.0
      base_prefactor: 1.3
    dehydrohalogenation:
      e0: 22.0                   # Loss of HX (HCl, HBr) high 4-center barrier (eV)
      sigma: 6.0
      base_prefactor: 0.1
    decarbonylation:
      e0: 18.0                   # Secondary loss of CO from acylium (eV)
      sigma: 6.0
      base_prefactor: 1.2
    alkane_cc_cleavage:
      e0: 14.5                   # Direct C-C cleavage in alkanes (eV)
      sigma: 5.5
      base_prefactor: 1.35
    secondary_cascade:
      e0: 26.0                   # High-energy secondary fragments (e.g., loss of C2H4, H2) (eV)
      sigma: 7.0
      base_prefactor: 0.55

# Natural Isotope Abundances (Fractional)
isotopes:
  C13_per_carbon: 0.0110         # 1.1% per carbon atom (M+1)
  H2_per_hydrogen: 0.00015       # 0.015%
  N15_per_nitrogen: 0.0037       # 0.37%
  O18_per_oxygen: 0.0020         # 0.20% (M+2)
  Cl35: 0.7577                   # ~3:1 ratio
  Cl37: 0.2423
  Br79: 0.5069                   # ~1:1 ratio
  Br81: 0.4931
  S34_per_sulfur: 0.0440         # 4.4% (M+2)
